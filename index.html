<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team members · MySaaS App</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <!-- Header and Navigation -->
  <div class="wrapper">

    <header class="site-header">
      <div class="product-name">
        <a href="#home">MySaaS App</a>
      </div>
      <nav class="site-nav">
        <a href="#dashboard">Dashboard</a>
        <a href="#team" aria-current="page">Team members</a>
        <!-- This means the exact page the user is currently looking at right now. -->
        <a href="#settings">Settings</a>
      </nav>
      <script src="script.js" defer></script>  <!-- Defer means run after the HTML loads. -->
    </header>

    <!-- Main content -->
    <main id="main" class="site-main">

      <!-- Page title and invite button -->
      <div class="page-header-container">
        <div class="page-title-group">
          <h1>Team members</h1>
          <p>Manage your team members and their permissions.</p>
        </div>
        <button type="button" class="btn btn--primary">Invite member</button>
      </div>


      <!-- Cards Seats used -->
      <div class="card">
        <div class="card-header">
          <h2>Seats used</h2>
          <span class="badge seat-usage-badge">90%</span>
        </div>
        <p class="metric">45 / 50</p>
        <button type="button" class="btn btn--secondary">Upgrade plan</button>
      </div>

      <!-- Members Section (Table) -->
      <section class="members-section">
        <h2>Members</h2>
        <div class="table-toolbar">
          <div class="search-field">
            <label for="member-search">Search members</label>
            <input type="search" id="member-search" placeholder="Search by name or email">
          </div>

          <div role="group" class="filter-group" aria-label="Filter by status">
            <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" class="filter-btn" data-filter="invited" aria-pressed="false">Invited</button>
            <button type="button" class="filter-btn" data-filter="deactivated" aria-pressed="false">Deactivated</button>
            <button type="button" class="filter-btn" data-filter="expired" aria-pressed="false">Expired</button>
          </div>
        </div>
        <div class="table-container">
          <table class="members-table">
            <caption><span class="sr-only">Workspace members</span></caption>
            <thead>
              <tr>
                <th scope="col">Name</th>
                <!-- By adding scope col, that tell Screen readers which is the header of the label -->
                <th scope="col">Role</th>
                <th scope="col">Status</th>
                <th scope="col">Last login</th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody>
             
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</body>

</html>
